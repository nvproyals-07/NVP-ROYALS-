<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — NVP ROYALS</title>
<meta name="robots" content="noindex">
<style>
  :root{--navy:#0A1F44;--navy-2:#102A57;--navy-3:#173B75;--gold:#F0CD66;
        --text:#EAF1FC;--muted:#A9BCD9;--line:rgba(240,205,102,.28);
        --ok:#4ADE80;--bad:#FF8A80;--warn:#FBBF24;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--text);line-height:1.6;
       font-family:"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
       background-image:radial-gradient(900px 420px at 85% -10%,rgba(240,205,102,.12),transparent 60%);}
  .wrap{width:min(760px,94%);margin:0 auto}
  button{font-family:inherit}

  header{border-bottom:1px solid var(--line);background:rgba(10,31,68,.96);position:sticky;top:0;z-index:20}
  .hbar{display:flex;align-items:center;gap:10px;padding:10px 0}
  .logo{height:38px;width:57px;border-radius:8px;background-image:var(--logo);background-size:cover;background-position:center}
  .brand b{display:block;font-family:Georgia,serif;font-size:14.5px;letter-spacing:1px}
  .brand span{display:block;font-size:9px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase}
  .who{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}

  .card{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
  h1{font-family:Georgia,serif;font-size:22px;margin:0 0 4px}
  h2{font-family:Georgia,serif;font-size:18px;margin:0 0 10px}
  label{display:block;font-size:12px;font-weight:700;color:var(--gold);margin:10px 0 4px}
  input{width:100%;padding:12px 13px;border-radius:11px;font:inherit;color:var(--text);
        background:#0C2551;border:1px solid rgba(169,188,217,.3)}
  input:focus{outline:none;border-color:var(--gold);background:#0E2A5C}
  .btn{width:100%;margin-top:14px;background:var(--gold);color:#1b1500;border:none;border-radius:30px;
       padding:13px;font-weight:700;font-size:15px;cursor:pointer}
  .btn.sm{width:auto;padding:9px 16px;font-size:13px;margin:0;border-radius:24px}
  .btn.line{background:transparent;color:var(--gold);border:2px solid var(--gold)}
  .msg{font-size:13px;margin:10px 0 0;min-height:18px}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}

  .tabs{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:24px;border:2px solid var(--line);background:transparent;
       color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--gold);color:#1b1500;border-color:var(--gold)}

  .app{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .app.pending{border-left:4px solid var(--warn)}
  .app.approved{border-left:4px solid var(--ok)}
  .app.rejected{border-left:4px solid var(--bad)}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
  .row span:first-child{color:var(--muted);min-width:96px}
  .row span:last-child{color:#fff;text-align:right;word-break:break-word}
  .name{font-size:16px;font-weight:700;color:#fff;margin:0 0 2px}
  .shop{font-size:13px;color:var(--gold);margin:0 0 8px}
  .why{background:#0C2551;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
        padding:4px 10px;border-radius:20px;margin-bottom:8px}
  .chip.pending{background:rgba(251,191,36,.15);color:var(--warn)}
  .chip.approved{background:rgba(74,222,128,.15);color:var(--ok)}
  .chip.rejected{background:rgba(255,138,128,.15);color:var(--bad)}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 0}
  .hidden{display:none !important}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <span class="logo" role="img" aria-label="NVP ROYALS"></span>
    <div class="brand"><b>NVP ROYALS</b><span>Admin Panel</span></div>
    <div class="who" id="who"></div>
  </div>
</header>

<div class="wrap">

  <!-- ============ LOGIN ============ -->
  <div id="loginBox">
    <div class="card">
      <h1>Admin login</h1>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 6px">Only NVP ROYALS admin can open this page.</p>
      <label>Email</label>
      <input id="em" type="email" placeholder="you@example.com" autocapitalize="off">
      <label>Password</label>
      <input id="pw" type="password" placeholder="••••">
      <button class="btn" onclick="doLogin()">Login</button>
      <p class="msg" id="loginMsg"></p>
    </div>
  </div>

  <!-- ============ PANEL ============ -->
  <div id="panel" class="hidden">
    <div class="card">
      <h1 style="margin-bottom:2px">Distributor applications</h1>
      <p style="color:var(--muted);font-size:13px;margin:0">Approve or reject in one tap. After approval, send the WhatsApp message.</p>
      <div class="tabs">
        <button class="tab on" id="tabPending" onclick="setTab('pending')">Pending</button>
        <button class="tab" id="tabApproved" onclick="setTab('approved')">Approved</button>
        <button class="tab" id="tabRejected" onclick="setTab('rejected')">Rejected</button>
        <button class="tab" id="tabAll" onclick="setTab('all')">All</button>
      </div>
      <button class="btn line sm" onclick="loadApps()" style="margin-top:8px">Refresh</button>
    </div>

    <div class="card" id="addCard">
      <h2>Add customer / distributor</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 6px">ID, password aur phone daalo — login turant ban jayega.</p>
      <label>Name</label><input id="n_name" placeholder="Ramesh Patel">
      <label>Shop / firm</label><input id="n_shop" placeholder="Patel Kirana Store">
      <label>Phone (10 digits)</label><input id="n_phone" inputmode="numeric" maxlength="10" placeholder="9876543210">
      <label>Login ID (small letters)</label><input id="n_id" autocapitalize="off" placeholder="patel">
      <label>Password</label><input id="n_pass" placeholder="1234">
      <label>Type</label>
      <select id="n_role" style="width:100%;padding:12px 13px;border-radius:11px;font:inherit;color:var(--text);background:#0C2551;border:1px solid rgba(169,188,217,.3)">
        <option value="customer">Customer</option>
        <option value="distributor">Distributor</option>
      </select>
      <button class="btn" onclick="addUser()">Create login</button>
      <p class="msg" id="n_msg"></p>
    </div>

    <div id="list"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://pybpdlubitlzlkmaohpw.supabase.co";
var SUPABASE_KEY = "sb_publishable_Cki1_BdfpPeoU2yBgr1zIw_Ra7BqCwX";
var sb = null, me = null, tab = "pending", APPS = [];

function initSb(){
  try {
    if (!sb && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch(e){ sb = null; }
  return sb;
}
initSb();
window.addEventListener("load", function(){
  initSb();
  if (!window.supabase) {
    var s = document.createElement("script");
    s.src = "https://unpkg.com/@supabase/supabase-js@2";
    s.onload = function(){ initSb(); boot(); };
    document.head.appendChild(s);
  } else { boot(); }
});

function $(id){ return document.getElementById(id); }
function say(id, text, kind){ var m=$(id); m.textContent=text||""; m.className="msg"+(kind?" "+kind:""); }

/* ---------- boot: already logged in? ---------- */
function boot(){
  if(!sb){ say("loginMsg","Could not load the login service. Check your internet.", "bad"); return; }
  sb.auth.getSession().then(function(r){
    if(r.data && r.data.session){ me = r.data.session.user; checkAdmin(); }
  });
}

function doLogin(){
  if(!sb){ say("loginMsg","Check your internet and try again.","bad"); return; }
  var em = ($("em").value||"").trim(), pw = ($("pw").value||"").trim();
  if(!em || !pw){ say("loginMsg","Please enter email and password.","bad"); return; }
  say("loginMsg","Checking…");
  sb.auth.signInWithPassword({ email: em, password: pw }).then(function(r){
    if(r.error){ say("loginMsg","Wrong email or password.","bad"); return; }
    me = r.data.user;
    checkAdmin();
  });
}

function checkAdmin(){
  sb.from("profiles").select("role,full_name").eq("id", me.id).single().then(function(r){
    if(r.error || !r.data || r.data.role !== "admin"){
      say("loginMsg","This account is not an admin.", "bad");
      sb.auth.signOut();
      return;
    }
    $("loginBox").classList.add("hidden");
    $("panel").classList.remove("hidden");
    $("who").innerHTML = (r.data.full_name || me.email) + "<br><a href='#' onclick='logout();return false;' style='color:var(--gold)'>Sign out</a>";
    loadApps();
  });
}

function logout(){
  sb.auth.signOut().then(function(){
    $("panel").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    $("who").textContent = "";
    say("loginMsg","");
  });
}

/* ---------- list ---------- */
function setTab(t){
  tab = t;
  ["Pending","Approved","Rejected","All"].forEach(function(n){
    var el = $("tab"+n);
    if(el) el.classList.remove("on");
  });
  var map = {pending:"tabPending", approved:"tabApproved", rejected:"tabRejected", all:"tabAll"};
  if($(map[t])) $(map[t]).classList.add("on");
  render();
}

function loadApps(){
  $("list").innerHTML = "<div class='empty'>Loading…</div>";
  sb.from("dealer_applications").select("*").order("created_at",{ascending:false}).then(function(r){
    if(r.error){
      $("list").innerHTML = "<div class='empty'>Could not load. " + (r.error.message||"") + "</div>";
      return;
    }
    APPS = r.data || [];
    render();
  });
}

function esc(s){ return (s===null||s===undefined) ? "—" : String(s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }

function render(){
  var rows = APPS.filter(function(a){ return tab === "all" ? true : a.status === tab; });
  if(!rows.length){ $("list").innerHTML = "<div class='empty'>No " + (tab==="all"?"":" "+tab) + " applications.</div>"; return; }

  $("list").innerHTML = rows.map(function(a){
    var acts = "";
    if(a.status === "pending"){
      acts = "<button class='btn sm' onclick=\"setStatus(" + a.id + ",'approved')\">Approve</button>" +
             "<button class='btn sm line' onclick=\"setStatus(" + a.id + ",'rejected')\">Reject</button>";
    } else {
      acts = "<a class='btn sm' target='_blank' rel='noopener' href='" + waLink(a, a.status) + "'>WhatsApp message</a>";
      if(a.status === "approved") acts += "<button class='btn sm line' onclick=\"setStatus(" + a.id + ",'pending')\">Undo</button>";
    }
    return "<div class='app " + a.status + "'>" +
      "<span class='chip " + a.status + "'>" + a.status + "</span>" +
      "<p class='name'>" + esc(a.name) + "</p>" +
      "<p class='shop'>" + esc(a.shop_name) + "</p>" +
      "<div class='row'><span>Mobile</span><span>" + esc(a.phone) + "</span></div>" +
      "<div class='row'><span>Village</span><span>" + esc(a.village) + "</span></div>" +
      "<div class='row'><span>Tehsil</span><span>" + esc(a.tehsil) + "</span></div>" +
      "<div class='row'><span>District</span><span>" + esc(a.district) + "</span></div>" +
      "<div class='row'><span>PIN</span><span>" + esc(a.pin) + "</span></div>" +
      "<div class='row'><span>Type</span><span>" + esc(a.type) + "</span></div>" +
      "<div class='row'><span>GST</span><span>" + esc(a.gst) + "</span></div>" +
      (a.why ? "<div class='why'>" + esc(a.why) + "</div>" : "") +
      "<div class='acts'>" + acts + "</div>" +
      "</div>";
  }).join("");
}

function setStatus(id, st){
  sb.from("dealer_applications").update({status: st}).eq("id", id).then(function(r){
    if(r.error){ alert("Could not update: " + (r.error.message||"")); return; }
    var a = APPS.filter(function(x){ return x.id === id; })[0];
    if(a) a.status = st;
    render();
    if(st === "approved" && a){ window.open(waLink(a, "approved"), "_blank"); }
  });
}

function addUser(){
  var body = {
    full_name: ($("n_name").value||"").trim(),
    shop_name: ($("n_shop").value||"").trim(),
    phone: ($("n_phone").value||"").replace(/\D/g,""),
    id: ($("n_id").value||"").trim().toLowerCase(),
    password: ($("n_pass").value||"").trim(),
    role: $("n_role").value
  };
  var m = $("n_msg");
  m.className = "msg bad";
  if(!body.id || !body.password || body.phone.length !== 10){
    m.textContent = "ID, password aur 10 ank ka phone zaroori hai."; return;
  }
  if(!/^[a-z0-9._-]+$/.test(body.id)){
    m.textContent = "Login ID mein sirf chhote akshar, ank, . _ - chalega — email nahi. Jaise: rajput";
    return;
  }
  m.className = "msg"; m.textContent = "Creating…";
  sb.functions.invoke("create-user", { body: body }).then(function(r){
    if(r.error){
      m.className = "msg bad";
      var base = r.error.message || "Edge Function error";
      if(r.error.context && typeof r.error.context.json === "function"){
        r.error.context.json().then(function(j){
          m.textContent = "Could not create: " + ((j && j.error) ? j.error : base);
        }).catch(function(){ m.textContent = "Could not create: " + base; });
      } else {
        m.textContent = "Could not create: " + base;
      }
      return;
    }
    if(r.data && r.data.error){
      m.className = "msg bad";
      m.textContent = "Could not create: " + r.data.error;
      return;
    }
    m.className = "msg ok";
    m.textContent = "Login created — ID: " + body.id + " · email: " + body.id + "@nvproyals.in · type: " + body.role;
    ["n_name","n_shop","n_phone","n_id","n_pass"].forEach(function(id){ $(id).value = ""; });
  });
}

function waLink(a, st){
  var msg;
  if(st === "approved"){
    msg = "Namaste " + (a.name||"") + " ji,\n\nAapka NVP ROYALS distributor application approve ho gaya hai. Aapko jald hi login ID aur password bheja jayega.\n\nHello! Your NVP ROYALS distributor application has been approved. Your login ID and password will be sent to you shortly.\n\n— NVP ROYALS GROUP OF INDUSTRIES";
  } else {
    msg = "Namaste " + (a.name||"") + " ji,\n\nDhanyavaad aapke NVP ROYALS distributor application ke liye. Abhi aapke area mein distributor ki zaroorat nahi hai — jab zaroorat hogi hum aapko yaad karenge.\n\nThank you for your interest in becoming an NVP ROYALS distributor. We will contact you when we open a distributorship in your area.\n\n— NVP ROYALS GROUP OF INDUSTRIES";
  }
  var ph = String(a.phone||"").replace(/\D/g,"");
  if(ph.length === 10) ph = "91" + ph;
  return "https://wa.me/" + ph + "?text=" + encodeURIComponent(msg);
}
</script>
