<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NVP ROYALS | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:Arial,sans-serif;

    background:#02091c;

    color:white;

}


.hidden{

    display:none!important;

}


/* =====================================================
   LOGIN PAGE
===================================================== */

.login-page{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:

    radial-gradient(
        circle at top,
        #123c83,
        transparent 40%
    ),

    #02091c;

}


.login-box{

    width:100%;

    max-width:420px;

    padding:35px 25px;

    border:1px solid #d7a522;

    border-radius:18px;

    background:#03133f;

    box-shadow:
    0 20px 60px rgba(0,0,0,.5);

    text-align:center;

}


.login-logo{

    width:130px;

    height:85px;

    object-fit:contain;

    margin-bottom:15px;

}


.login-box h1{

    font-family:Georgia,serif;

    margin-bottom:8px;

}


.login-box h1 span{

    color:#ffe58a;

}


.login-box p{

    color:#9da8c2;

    font-size:13px;

    margin-bottom:25px;

}


/* =====================================================
   INPUT
===================================================== */

.input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:1px solid
    rgba(215,165,34,.35);

    border-radius:7px;

    background:#01091f;

    color:white;

    outline:none;

}


.input:focus{

    border-color:#ffe58a;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.button{

    width:100%;

    padding:14px;

    border:0;

    border-radius:7px;

    cursor:pointer;

    font-weight:bold;

    background:

    linear-gradient(
        135deg,
        #a8770a,
        #ffe18a,
        #b57c0b
    );

    color:#071027;

}


.button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


.login-error{

    color:#ff9d9d;

    font-size:12px;

    margin-top:15px;

    line-height:1.6;

}


/* =====================================================
   ADMIN PAGE
===================================================== */

.admin-page{

    min-height:100vh;

    background:

    radial-gradient(
        circle at top,
        #0a2860,
        transparent 35%
    ),

    #02091c;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:sticky;

    top:0;

    z-index:10;

    background:
    rgba(1,9,31,.95);

    border-bottom:
    1px solid
    rgba(215,165,34,.3);

    backdrop-filter:blur(10px);

}


.header-inner{

    width:min(1200px,94%);

    min-height:75px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.logo{

    width:90px;

    height:60px;

    object-fit:contain;

}


.logout{

    padding:10px 18px;

    border:1px solid #d7a522;

    border-radius:6px;

    background:transparent;

    color:#ffe58a;

    cursor:pointer;

}


.logout:hover{

    background:#d7a522;

    color:#071027;

}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

    width:min(1200px,94%);

    margin:auto;

    padding:40px 0 70px;

}


.title{

    margin-bottom:30px;

}


.title h1{

    font-family:Georgia,serif;

    font-size:clamp(
        30px,
        5vw,
        48px
    );

}


.title h1 span{

    color:#ffe58a;

}


.title p{

    color:#8e9bb5;

    margin-top:8px;

}


/* =====================================================
   NOTICE
===================================================== */

.notice{

    display:none;

    margin-bottom:20px;

    padding:15px;

    border-radius:8px;

    font-size:13px;

    line-height:1.6;

}


.notice.show{

    display:block;

}


.notice.error{

    color:#ffd0d0;

    background:#441c1c;

    border:1px solid
    rgba(255,100,100,.25);

}


.notice.success{

    color:#c4ffd5;

    background:#123d26;

    border:1px solid
    rgba(80,210,130,.25);

}


/* =====================================================
   STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;

}


.stat{

    padding:20px;

    border:
    1px solid
    rgba(215,165,34,.25);

    border-radius:12px;

    background:#03133f;

}


.stat small{

    color:#8e9bb5;

}


.stat strong{

    display:block;

    font-size:30px;

    color:#ffe58a;

    margin-top:7px;

}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    display:flex;

    gap:10px;

    margin-bottom:25px;

    flex-wrap:wrap;

}


.search{

    flex:1;

    min-width:220px;

    padding:13px;

    border:
    1px solid
    rgba(215,165,34,.3);

    border-radius:7px;

    background:#01091f;

    color:white;

    outline:none;

}


.search:focus{

    border-color:#ffe58a;

}


.filter{

    padding:13px;

    border:
    1px solid
    rgba(215,165,34,.3);

    border-radius:7px;

    background:#03133f;

    color:white;

}


/* =====================================================
   APPLICATION CARD
===================================================== */

.application{

    background:#03133f;

    border:
    1px solid
    rgba(215,165,34,.25);

    border-radius:15px;

    margin-bottom:18px;

    overflow:hidden;

}


.application-head{

    padding:18px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    border-bottom:
    1px solid
    rgba(255,255,255,.06);

}


.application-head h3{

    font-size:17px;

}


.application-head small{

    color:#8995ad;

    word-break:break-all;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    padding:6px 11px;

    border-radius:20px;

    font-size:11px;

    font-weight:bold;

}


.pending{

    background:#594500;

    color:#ffe58a;

}


.approved{

    background:#124d2b;

    color:#9cffbc;

}


.rejected{

    background:#5a1d1d;

    color:#ffb0b0;

}


/* =====================================================
   APPLICATION BODY
===================================================== */

.application-body{

    padding:20px;

}


.details{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:13px;

}


.detail{

    padding:12px;

    border-radius:8px;

    background:#020b25;

}


.detail.full{

    grid-column:1/-1;

}


.detail label{

    display:block;

    color:#78869f;

    font-size:10px;

    margin-bottom:5px;

}


.detail span{

    font-size:13px;

    word-break:break-word;

}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

    display:flex;

    gap:10px;

    margin-top:20px;

}


.approve,
.reject{

    padding:12px 20px;

    border:0;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

}


.approve{

    background:#1b8a4b;

    color:white;

}


.reject{

    background:#9b3030;

    color:white;

}


.approve:hover{

    opacity:.85;

}


.reject:hover{

    opacity:.85;

}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.loading,
.empty{

    text-align:center;

    padding:50px 20px;

    color:#8995ad;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .stats{

        grid-template-columns:1fr;

    }


    .details{

        grid-template-columns:1fr;

    }


    .detail.full{

        grid-column:auto;

    }


    .application-head{

        align-items:flex-start;

        flex-direction:column;

    }


    .actions{

        flex-direction:column;

    }


    .approve,
    .reject{

        width:100%;

    }

}

</style>

</head>
<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<section
    id="loginPage"
    class="login-page"
>


    <div class="login-box">


        <img
            src="logo.png"
            class="login-logo"
            alt="NVP ROYALS"
        >


        <h1>

            NVP
            <span>ROYALS</span>

        </h1>


        <p>

            Distributor Admin Panel

        </p>


        <form id="loginForm">


            <input
                class="input"
                id="loginEmail"
                type="email"
                placeholder="Admin Email"
                required
            >


            <input
                class="input"
                id="loginPassword"
                type="password"
                placeholder="Password"
                required
            >


            <button
                class="button"
                id="loginButton"
                type="submit"
            >

                ADMIN LOGIN

            </button>


        </form>


        <div
            id="loginError"
            class="login-error"
        ></div>


    </div>

</section>



<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<section
    id="adminPage"
    class="admin-page hidden"
>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">


        <div class="header-inner">


            <img
                src="logo.png"
                class="logo"
                alt="NVP ROYALS"
            >


            <button
                class="logout"
                id="logoutButton"
                type="button"
            >

                Logout

            </button>


        </div>


    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="container">


        <!-- =================================================
             TITLE
        ================================================== -->

        <div class="title">


            <h1>

                Distributor
                <span>Applications</span>

            </h1>


            <p>

                NVP ROYALS Distributor Approval Control

            </p>


        </div>



        <!-- =================================================
             NOTICE
        ================================================== -->

        <div
            id="notice"
            class="notice"
        ></div>



        <!-- =================================================
             STATS
        ================================================== -->

        <div class="stats">


            <div class="stat">

                <small>
                    Pending
                </small>

                <strong id="pendingCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    Approved
                </small>

                <strong id="approvedCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    Rejected
                </small>

                <strong id="rejectedCount">
                    0
                </strong>

            </div>


        </div>



        <!-- =================================================
             SEARCH / FILTER
        ================================================== -->

        <div class="controls">


            <input
                id="searchInput"
                class="search"
                type="search"
                placeholder="Name, Mobile, City से search करें"
            >


            <select
                id="statusFilter"
                class="filter"
            >

                <option value="all">
                    सभी Applications
                </option>


                <option value="pending">
                    Pending
                </option>


                <option value="approved">
                    Approved
                </option>


                <option value="rejected">
                    Rejected
                </option>

            </select>


        </div>



        <!-- =================================================
             APPLICATIONS
        ================================================== -->

        <div id="applications">


            <div class="loading">

                Applications load हो रही हैं...

            </div>


        </div>


    </main>


</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://pybpdlubitlzlkmaohpw.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Cki1_BdfpPeoU2yBgr1zIw_Ra7BqCwX";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
    document.getElementById(
        "loginPage"
    );


const adminPage =
    document.getElementById(
        "adminPage"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const applicationsBox =
    document.getElementById(
        "applications"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const statusFilter =
    document.getElementById(
        "statusFilter"
    );


const notice =
    document.getElementById(
        "notice"
    );



/* =====================================================
   DATA
===================================================== */

let allApplications = [];



/* =====================================================
   NOTICE FUNCTION
===================================================== */

function showNotice(
    text,
    type
){

    notice.textContent = text;

    notice.className =
        "notice show " + type;

}



function hideNotice(){

    notice.textContent = "";

    notice.className =
        "notice";

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        loginError.textContent = "";


        loginButton.disabled = true;


        loginButton.textContent =
            "LOGIN हो रहा है...";


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .signInWithPassword({

            email: email,

            password: password

        });


        if(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            loginError.textContent =
                "Email या Password गलत है।";


            loginButton.disabled = false;


            loginButton.textContent =
                "ADMIN LOGIN";


            return;

        }


        if(!data.session){

            loginError.textContent =
                "Login session नहीं बनी।";


            loginButton.disabled = false;


            loginButton.textContent =
                "ADMIN LOGIN";


            return;

        }


        showAdmin();

    }
);



/* =====================================================
   SHOW ADMIN
===================================================== */

async function showAdmin(){

    loginPage.classList.add(
        "hidden"
    );


    adminPage.classList.remove(
        "hidden"
    );


    loginButton.disabled = false;


    loginButton.textContent =
        "ADMIN LOGIN";


    await loadApplications();

}



/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkSession(){

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getSession();


    if(error){

        console.error(
            "SESSION ERROR:",
            error
        );

        return;

    }


    if(data.session){

        await showAdmin();

    }

}



/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient
        .auth
        .signOut();


        adminPage.classList.add(
            "hidden"
        );


        loginPage.classList.remove(
            "hidden"
        );


        loginError.textContent = "";


        applicationsBox.innerHTML =
            `
            <div class="loading">

                Applications load हो रही हैं...

            </div>
            `;

    }
);



/* =====================================================
   LOAD APPLICATIONS
===================================================== */

async function loadApplications(){

    hideNotice();


    applicationsBox.innerHTML =
        `
        <div class="loading">

            Applications load हो रही हैं...

        </div>
        `;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("distributors")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        applicationsBox.innerHTML =
            `
            <div class="empty">

                Applications load नहीं हो सकीं।

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unknown error"
                )}

            </div>
            `;


        showNotice(
            "Applications load नहीं हो सकीं।",
            "error"
        );


        return;

    }


    allApplications =
        data || [];


    updateStats();


    renderApplications();

}



/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    let pending = 0;

    let approved = 0;

    let rejected = 0;


    allApplications.forEach(
        function(app){

            const status =
                app.status ||
                "pending";


            if(status === "pending"){

                pending++;

            }


            if(status === "approved"){

                approved++;

            }


            if(status === "rejected"){

                rejected++;

            }

        }
    );


    document.getElementById(
        "pendingCount"
    ).textContent = pending;


    document.getElementById(
        "approvedCount"
    ).textContent = approved;


    document.getElementById(
        "rejectedCount"
    ).textContent = rejected;

}



/* =====================================================
   SEARCH + FILTER EVENTS
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        renderApplications();

    }
);


statusFilter.addEventListener(
    "change",
    function(){

        renderApplications();

    }
);
  /* =====================================================
   RENDER APPLICATIONS
===================================================== */

function renderApplications(){

    const search =
        searchInput
        .value
        .trim()
        .toLowerCase();


    const filter =
        statusFilter.value;


    const filtered =
        allApplications.filter(
            function(app){

                const name =
                    String(
                        app.full_name || ""
                    ).toLowerCase();


                const mobile =
                    String(
                        app.mobile || ""
                    ).toLowerCase();


                const whatsapp =
                    String(
                        app.whatsapp || ""
                    ).toLowerCase();


                const city =
                    String(
                        app.city || ""
                    ).toLowerCase();


                const district =
                    String(
                        app.district || ""
                    ).toLowerCase();


                const matchesSearch =

                    !search ||

                    name.includes(search) ||

                    mobile.includes(search) ||

                    whatsapp.includes(search) ||

                    city.includes(search) ||

                    district.includes(search);


                const status =
                    app.status ||
                    "pending";


                const matchesStatus =

                    filter === "all" ||

                    status === filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    if(filtered.length === 0){

        applicationsBox.innerHTML =
            `
            <div class="empty">

                कोई application नहीं मिली।

            </div>
            `;

        return;

    }


    applicationsBox.innerHTML =
        filtered
        .map(
            createApplicationHTML
        )
        .join("");

}



/* =====================================================
   CREATE APPLICATION HTML
===================================================== */

function createApplicationHTML(app){

    const status =
        app.status ||
        "pending";


    const statusClass =

        status === "approved"
        ? "approved"

        : status === "rejected"
        ? "rejected"

        : "pending";


    const created =
        app.created_at
        ? new Date(
            app.created_at
          ).toLocaleString(
              "hi-IN"
          )

        : "-";


    let actions = "";


    if(status === "pending"){

        actions =
            `
            <div class="actions">


                <button
                    class="approve"
                    type="button"
                    onclick="changeStatus(
                        '${escapeJS(app.id)}',
                        'approved'
                    )"
                >

                    ✓ APPROVE

                </button>


                <button
                    class="reject"
                    type="button"
                    onclick="changeStatus(
                        '${escapeJS(app.id)}',
                        'rejected'
                    )"
                >

                    ✕ REJECT

                </button>


            </div>
            `;

    }


    return `

        <article
            class="application"
        >


            <div
                class="application-head"
            >


                <div>


                    <h3>

                        ${escapeHTML(
                            app.full_name ||
                            "-"
                        )}

                    </h3>


                    <small>

                        Application ID:
                        ${escapeHTML(
                            String(
                                app.id || "-"
                            )
                        )}

                    </small>


                </div>


                <span
                    class="status
                    ${statusClass}"
                >

                    ${escapeHTML(
                        status.toUpperCase()
                    )}

                </span>


            </div>



            <div
                class="application-body"
            >


                <div
                    class="details"
                >


                    ${detail(
                        "Mobile",
                        app.mobile
                    )}


                    ${detail(
                        "WhatsApp",
                        app.whatsapp
                    )}


                    ${detail(
                        "Email",
                        app.email
                    )}


                    ${detail(
                        "Business",
                        app.business_name
                    )}


                    ${detail(
                        "State",
                        app.state
                    )}


                    ${detail(
                        "District",
                        app.district
                    )}


                    ${detail(
                        "City / Town",
                        app.city
                    )}


                    ${detail(
                        "PIN Code",
                        app.pincode
                    )}


                    ${detail(
                        "Experience",
                        app.experience
                    )}


                    ${detail(
                        "Investment",
                        app.investment
                    )}


                    ${detail(
                        "Registration Date",
                        created
                    )}


                    ${detail(
                        "Address",
                        app.address,
                        true
                    )}


                </div>



                ${actions}


            </div>


        </article>

    `;

}



/* =====================================================
   DETAIL
===================================================== */

function detail(
    label,
    value,
    full = false
){

    return `

        <div
            class="detail
            ${full ? "full" : ""}"
        >


            <label>

                ${escapeHTML(
                    label
                )}

            </label>


            <span>

                ${escapeHTML(
                    value || "-"
                )}

            </span>


        </div>

    `;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );

}



/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
    id,
    newStatus
){

    const question =

        newStatus === "approved"

        ?

        "क्या आप इस Distributor को APPROVE करना चाहते हैं?"

        :

        "क्या आप इस application को REJECT करना चाहते हैं?";


    const confirmed =
        confirm(question);


    if(!confirmed){

        return;

    }


    showNotice(
        "Status update हो रहा है...",
        "success"
    );


    const {
        error
    } =
    await supabaseClient
    .from("distributors")
    .update({

        status:
            newStatus

    })
    .eq(
        "id",
        id
    );


    if(error){

        console.error(
            "STATUS UPDATE ERROR:",
            error
        );


        showNotice(
            "Status update नहीं हो सका: " +
            error.message,
            "error"
        );


        return;

    }


    showNotice(

        newStatus === "approved"

        ?

        "Distributor successfully APPROVED."

        :

        "Application successfully REJECTED.",

        "success"

    );


    await loadApplications();

}



/* =====================================================

checkSession();


</script>
