<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NVP ROYALS | Login</title>

<meta
    name="description"
    content="Login to your NVP ROYALS account."
>

<link
    rel="icon"
    type="image/png"
    href="logo.png"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:Arial,sans-serif;

    color:white;

    background:

    radial-gradient(
        circle at top,
        #123c83,
        transparent 45%
    ),

    #02091c;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px 15px;

}

.login-page{

    width:100%;

    max-width:430px;

}

.logo-area{

    text-align:center;

    margin-bottom:25px;

}

.logo{

    width:100px;

    height:80px;

    object-fit:contain;

}

.logo-area h1{

    font-family:Georgia,serif;

    font-size:30px;

    margin-top:5px;

}

.logo-area h1 span{

    color:#ffe58a;

}

.tagline{

    color:#ffe58a;

    font-family:Georgia,serif;

    font-size:13px;

    letter-spacing:1px;

    margin-top:6px;

}

.login-box{

    background:#03133f;

    border:

    1px solid

    rgba(215,165,34,.35);

    border-radius:18px;

    padding:25px;

    box-shadow:

    0 20px 60px

    rgba(0,0,0,.45);

}

.login-box h2{

    text-align:center;

    font-family:Georgia,serif;

    margin-bottom:5px;

}

.subtitle{

    text-align:center;

    color:#9da8c2;

    font-size:13px;

    margin-bottom:25px;

}

.google-btn{

    width:100%;

    padding:14px;

    border:1px solid

    rgba(255,255,255,.15);

    border-radius:8px;

    background:#ffffff;

    color:#111;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.google-btn:hover{

    transform:translateY(-2px);

}

.google-btn:active{

    transform:scale(.96);

}

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:22px 0;

    color:#77839c;

    font-size:12px;

}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:

    rgba(255,255,255,.12);

}

label{

    display:block;

    color:#e7ebf5;

    font-size:13px;

    margin-bottom:7px;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border-radius:7px;

    border:

    1px solid

    rgba(215,165,34,.3);

    background:#01091f;

    color:white;

    outline:none;

    font-size:14px;

}

input:focus{

    border-color:#ffe58a;

    box-shadow:

    0 0 0 3px

    rgba(255,229,138,.08);

}

.primary-btn{

    width:100%;

    padding:15px;

    border:0;

    border-radius:8px;

    background:

    linear-gradient(
        135deg,
        #a8770a,
        #ffe18a,
        #b57c0b
    );

    color:#071027;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.primary-btn:active{

    transform:scale(.96);

}

.secondary-btn{

    width:100%;

    padding:13px;

    margin-top:10px;

    border-radius:8px;

    border:

    1px solid

    rgba(255,229,138,.35);

    background:transparent;

    color:#ffe58a;

    cursor:pointer;

}

.phone-section{

    display:none;

}

.message{

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    text-align:center;

    font-size:13px;

    display:none;

}

.message.show{

    display:block;

}

.error{

    background:#45151b;

    border:1px solid #8d303b;

    color:#ffc5cc;

}

.success{

    background:#123d26;

    border:1px solid #27834b;

    color:#c4ffd5;

}

.back-home{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#9da8c2;

    font-size:13px;

}

.back-home:hover{

    color:#ffe58a;

}

@media(max-width:480px){

    .login-box{

        padding:20px 16px;

    }

}

</style>

</head>


<body>


<div class="login-page">


<div class="logo-area">

<img
    src="logo.png"
    class="logo"
    alt="NVP ROYALS"
>

<h1>
NVP <span>ROYALS</span>
</h1>

<div class="tagline">
Legacy of Purity
</div>

</div>


<div class="login-box">


<h2>
Login / Sign Up
</h2>

<p class="subtitle">
NVP ROYALS account में प्रवेश करें
</p>


<!-- GOOGLE -->

<button
    type="button"
    id="googleBtn"
    class="google-btn"
>

Continue with Google

</button>


<div class="divider">
OR
</div>


<!-- EMAIL -->

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="your@email.com"
    autocomplete="email"
>


<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
>


<button
    type="button"
    id="emailLoginBtn"
    class="primary-btn"
>

Login with Email

</button>


<button
    type="button"
    id="emailSignupBtn"
    class="secondary-btn"
>

Create New Account

</button>


<div class="divider">
OR
</div>


<!-- PHONE -->

<label for="phone">
Mobile Number
</label>

<input
    type="tel"
    id="phone"
    placeholder="+91 9876543210"
    autocomplete="tel"
>


<button
    type="button"
    id="phoneOtpBtn"
    class="primary-btn"
>

Send OTP

</button>


<div
    id="otpSection"
    class="phone-section"
>

<br>

<label for="otp">
OTP
</label>

<input
    type="text"
    id="otp"
    placeholder="6 digit OTP"
    inputmode="numeric"
    maxlength="6"
>


<button
    type="button"
    id="verifyOtpBtn"
    class="primary-btn"
>

Verify OTP

</button>

</div>


<div
    id="message"
    class="message"
></div>


<a
    href="index.html"
    class="back-home"
>

← Back to NVP ROYALS

</a>


</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pybpdlubitlzlkmaohpw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Cki1_BdfpPeoU2yBgr1zIw_Ra7BqCwX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const googleBtn =
document.getElementById(
    "googleBtn"
);

const emailLoginBtn =
document.getElementById(
    "emailLoginBtn"
);

const emailSignupBtn =
document.getElementById(
    "emailSignupBtn"
);

const phoneOtpBtn =
document.getElementById(
    "phoneOtpBtn"
);

const verifyOtpBtn =
document.getElementById(
    "verifyOtpBtn"
);

const otpSection =
document.getElementById(
    "otpSection"
);

const message =
document.getElementById(
    "message"
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent = text;

    message.className =
        "message show " + type;

}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

googleBtn.addEventListener(
    "click",
    async function(){

        googleBtn.disabled = true;

        googleBtn.textContent =
            "Google Login खुल रहा है...";


        const {
            error
        } =
        await supabaseClient
        .auth
        .signInWithOAuth({

            provider:"google",

            options:{

                redirectTo:
                window.location.origin +
                "/index.html"

            }

        });


        if(error){

            console.error(error);

            showMessage(
                error.message,
                "error"
            );

            googleBtn.disabled = false;

            googleBtn.textContent =
                "Continue with Google";

        }

    }
);


/* =====================================================
   EMAIL LOGIN
===================================================== */

emailLoginBtn.addEventListener(
    "click",
    async function(){

        const email =
        document
        .getElementById("email")
        .value
        .trim();

        const password =
        document
        .getElementById("password")
        .value;


        if(!email || !password){

            showMessage(
                "Email और Password भरें।",
                "error"
            );

            return;

        }


        emailLoginBtn.disabled = true;

        emailLoginBtn.textContent =
            "Login हो रहा है...";


        const {
            error
        } =
        await supabaseClient
        .auth
        .signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            showMessage(
                error.message,
                "error"
            );

            emailLoginBtn.disabled = false;

            emailLoginBtn.textContent =
                "Login with Email";

            return;

        }


        showMessage(
            "Login successful. Home page खुल रहा है...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "index.html";

            },
            800
        );

    }
);


/* =====================================================
   EMAIL SIGNUP
===================================================== */

emailSignupBtn.addEventListener(
    "click",
    async function(){

        const email =
        document
        .getElementById("email")
        .value
        .trim();

        const password =
        document
        .getElementById("password")
        .value;


        if(!email || !password){

            showMessage(
                "Email और Password भरें।",
                "error"
            );

            return;

        }


        if(password.length < 6){

            showMessage(
                "Password कम से कम 6 characters का होना चाहिए।",
                "error"
            );

            return;

        }


        emailSignupBtn.disabled = true;

        emailSignupBtn.textContent =
            "Account बन रहा है...";


        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .signUp({

            email:email,

            password:password,

            options:{

                emailRedirectTo:
                window.location.origin +
                "/index.html"

            }

        });


        if(error){

            showMessage(
                error.message,
                "error"
            );

            emailSignupBtn.disabled = false;

            emailSignupBtn.textContent =
                "Create New Account";

            return;

        }


        showMessage(
            "Account बन गया। अगर email verification enabled है तो अपना email verify करें।",
            "success"
        );


        emailSignupBtn.disabled = false;

        emailSignupBtn.textContent =
            "Create New Account";

    }
);


/* =====================================================
   SEND PHONE OTP
===================================================== */

phoneOtpBtn.addEventListener(
    "click",
    async function(){

        const phone =
        document
        .getElementById("phone")
        .value
        .trim();


        if(!phone){

            showMessage(
                "Mobile number डालें।",
                "error"
            );

            return;

        }


        phoneOtpBtn.disabled = true;

        phoneOtpBtn.textContent =
            "OTP भेजा जा रहा है...";


        const {
            error
        } =
        await supabaseClient
        .auth
        .signInWithOtp({

            phone:phone

        });


        if(error){

            showMessage(
                error.message,
                "error"
            );

            phoneOtpBtn.disabled = false;

            phoneOtpBtn.textContent =
                "Send OTP";

            return;

        }


        otpSection.style.display =
            "block";


        showMessage(
            "OTP भेज दिया गया है। OTP डालकर Verify करें।",
            "success"
        );


        phoneOtpBtn.disabled = false;

        phoneOtpBtn.textContent =
            "OTP Sent ✓";

    }
);


/* =====================================================
   VERIFY PHONE OTP
===================================================== */

verifyOtpBtn.addEventListener(
    "click",
    async function(){

        const phone =
        document
        .getElementById("phone")
        .value
        .trim();

        const token =
        document
        .getElementById("otp")
        .value
        .trim();


        if(!phone || !token){

            showMessage(
                "Mobile number और OTP भरें।",
                "error"
            );

            return;

        }


        verifyOtpBtn.disabled = true;

        verifyOtpBtn.textContent =
            "Verify हो रहा है...";


        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .verifyOtp({

            phone:phone,

            token:token,

            type:"sms"

        });


        if(error){

            showMessage(
                error.message,
                "error"
            );

            verifyOtpBtn.disabled = false;

            verifyOtpBtn.textContent =
                "Verify OTP";

            return;

        }


        showMessage(
            "Login successful. Home page खुल रहा है...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "index.html";

            },
            800
        );

    }
);


/* =====================================================
   EXISTING SESSION CHECK
===================================================== */

supabaseClient
.auth
.getSession()
.then(
    function(result){

        const session =
            result.data.session;

        if(session){

            /*
              Already logged in.
              फिलहाल user को home पर भेज रहे हैं।
            */

            // window.location.href = "index.html";

        }

    }
);

</script>

</body>

</html>
